<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 970" width="1540" height="970" role="img" aria-labelledby="title description">
<title id="title">Cockpit Tasks workflow</title>
<desc id="description">The owner gives a request. The agent adds a task to the queue and starts work. Completion closes the task in history and may create an owner review card. Deferral records a reason in the backlog. Acceptance preserves the closed task; requested changes return the same task to the queue.</desc>
<rect width="1540" height="970" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#9280da"/></marker></defs>
<path data-edge-id="e12" d="M 260 210 L 380 210" fill="none" stroke="#9280da" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge-id="e14" d="M 580 210 L 760 210" fill="none" stroke="#9280da" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge-id="e16" d="M 980 210 L 1160 210" fill="none" stroke="#9280da" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge-id="e18" d="M 1290 250 L 1290 340 L 880 340 L 880 450" fill="none" stroke="#9280da" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge-id="e20" d="M 1360 250 L 1360 450" fill="none" stroke="#9280da" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge-id="e22" d="M 750 505 L 500 505" fill="none" stroke="#9280da" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge-id="e24" d="M 350 560 L 350 690" fill="none" stroke="#9280da" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge-id="e25" d="M 455 560 L 455 630 L 880 630 L 880 690" fill="none" stroke="#9280da" stroke-width="2" marker-end="url(#arrow)"/>
<path data-edge-id="e26" d="M 1050 745 L 1510 745 L 1510 130 L 870 130 L 870 170" fill="none" stroke="#9280da" stroke-width="2" marker-end="url(#arrow)"/>
<text data-cell-id="n1" x="60" y="45" dominant-baseline="central" text-anchor="start" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#42365e">How Cockpit Tasks work</text>
<text data-cell-id="n2" x="60" y="95" dominant-baseline="central" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">A request becomes tracked work. Owner feedback stays linked to the same task.</text>
<rect data-cell-id="n3" x="60" y="170" width="200" height="80" fill="white" stroke="#9280da" stroke-width="2"/>
<text data-cell-id="n3" x="160" y="196.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#42365e">OWNER</text>
<text data-cell-id="n3" x="160" y="223.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Defines the request</text>
<rect data-cell-id="n4" x="380" y="170" width="200" height="80" fill="white" stroke="#9280da" stroke-width="2"/>
<text data-cell-id="n4" x="480" y="196.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#42365e">AGENT</text>
<text data-cell-id="n4" x="480" y="223.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Plans the work</text>
<rect data-cell-id="n5" x="760" y="170" width="220" height="80" fill="white" stroke="#9280da" stroke-width="2"/>
<text data-cell-id="n5" x="870" y="196.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#42365e">QUEUE</text>
<text data-cell-id="n5" x="870" y="223.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Waiting to start</text>
<rect data-cell-id="n6" x="1160" y="170" width="260" height="80" fill="white" stroke="#9280da" stroke-width="2"/>
<text data-cell-id="n6" x="1290" y="196.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#42365e">IN PROGRESS</text>
<text data-cell-id="n6" x="1290" y="223.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Edits, commits, executors</text>
<rect data-cell-id="n7" x="750" y="450" width="260" height="110" fill="white" stroke="#9280da" stroke-width="2"/>
<text data-cell-id="n7" x="880" y="478" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#42365e">HISTORY</text>
<text data-cell-id="n7" x="880" y="505" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Task is closed</text>
<text data-cell-id="n7" x="880" y="532" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Result is preserved</text>
<rect data-cell-id="n8" x="1240" y="450" width="240" height="110" fill="white" stroke="#9280da" stroke-width="2"/>
<text data-cell-id="n8" x="1360" y="478" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#42365e">BACKLOG</text>
<text data-cell-id="n8" x="1360" y="505" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Reason recorded</text>
<text data-cell-id="n8" x="1360" y="532" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Resume when ready</text>
<rect data-cell-id="n9" x="200" y="450" width="300" height="110" fill="white" stroke="#9280da" stroke-width="2"/>
<text data-cell-id="n9" x="350" y="478" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#42365e">OWNER REVIEW</text>
<text data-cell-id="n9" x="350" y="505" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Review card¹</text>
<text data-cell-id="n9" x="350" y="532" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Choose an outcome</text>
<rect data-cell-id="n10" x="200" y="690" width="300" height="110" fill="white" stroke="#9280da" stroke-width="2"/>
<text data-cell-id="n10" x="350" y="718" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#42365e">ACCEPTED</text>
<text data-cell-id="n10" x="350" y="745" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Agent receives the reply</text>
<text data-cell-id="n10" x="350" y="772" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Task remains in history</text>
<rect data-cell-id="n11" x="710" y="690" width="340" height="110" fill="white" stroke="#9280da" stroke-width="2"/>
<text data-cell-id="n11" x="880" y="718" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#42365e">CHANGES REQUESTED</text>
<text data-cell-id="n11" x="880" y="745" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Agent receives the feedback</text>
<text data-cell-id="n11" x="880" y="772" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="normal" fill="#42365e">Same task returns to the queue</text>
<rect x="272.57" y="191.85" width="94.86" height="36.3" fill="white"/>
<text data-cell-id="lbl13" x="320" y="210" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#42365e">request</text>
<rect x="617.08" y="191.85" width="105.84" height="36.3" fill="white"/>
<text data-cell-id="lbl15" x="670" y="210" dominant-baseline="central" text-anchor="middle" font-family="monospace" font-size="18" font-weight="normal" fill="#42365e">task_add</text>
<rect x="1006.1" y="191.85" width="127.8" height="36.3" fill="white"/>
<text data-cell-id="lbl17" x="1070" y="210" dominant-baseline="central" text-anchor="middle" font-family="monospace" font-size="18" font-weight="normal" fill="#42365e">task_start</text>
<rect x="1231.59" y="277.6" width="116.82" height="36.3" fill="white"/>
<text data-cell-id="lbl19" x="1290" y="295.75" dominant-baseline="central" text-anchor="middle" font-family="monospace" font-size="18" font-weight="normal" fill="#42365e">task_done</text>
<rect x="1296.1" y="331.85" width="127.8" height="36.3" fill="white"/>
<text data-cell-id="lbl21" x="1360" y="350" dominant-baseline="central" text-anchor="middle" font-family="monospace" font-size="18" font-weight="normal" fill="#42365e">task_defer</text>
<rect x="550.12" y="486.85" width="149.76" height="36.3" fill="white"/>
<text data-cell-id="lbl23" x="625" y="505" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#42365e">review card¹</text>
<text data-cell-id="n27" x="60" y="875" dominant-baseline="central" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#42365e">Owner edits and comments increment the revision; the agent reads changes before completing or deferring.</text>
<text data-cell-id="n28" x="60" y="925" dominant-baseline="central" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#42365e">¹ A review card is created only when task_done includes review other than &quot;none&quot;.</text>
</svg>
